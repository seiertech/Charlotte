book:
  title: "THE SYSTEM OF YOU"
  foundation_file: "foundation/Me_OS_Foundation.md"
  output_file: "output/full_first_draft.md"

provider:
  type: "nim"
  protocol: "openai_compatible"
  base_url: "https://integrate.api.nvidia.com/v1"
  model: "mistralai/mistral-small-4-119b-2603"
  api_key_env: "NIM_API_KEY"
  timeout_seconds: 180

runtime_defaults:
  max_tokens: 16384
  temperature: 0.1
  top_p: 1.0
  reasoning_effort: "high"
  tool_choice: "auto"

workflow:
  max_revisions: 3
  chapter_word_target: 3500
  run_general_reviewer: true
  run_personas: true
  run_safety_warden: true
  run_continuity_warden: true
  run_voice_warden: true

agents:
  book_manager: "agents/book_manager.md"
  outliner: "agents/outliner.md"
  researcher: "agents/researcher.md"
  drafter: "agents/drafter.md"
  reviewer: "agents/reviewer.md"
  editor: "agents/editor.md"
  warden_voice: "agents/warden_voice.md"
  warden_safety: "agents/warden_safety.md"
  warden_continuity: "agents/warden_continuity.md"

personas:
  - "agents/personas/skeptic.md"
  - "agents/personas/overwhelmed.md"
  - "agents/personas/young_reader.md"
  - "agents/personas/elder.md"
  - "agents/personas/literal.md"
  - "agents/personas/vulnerable.md"
